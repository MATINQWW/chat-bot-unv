# /etc/nginx/sites-available/chatbot  (دامنه را عوض کنید، سپس certbot --nginx)
upstream chatbot { server 127.0.0.1:3000; keepalive 64; }
server {
  listen 80;
  server_name bot.example.ir;
  client_max_body_size 12m;           # عکس و صدا
  location / {
    proxy_pass http://chatbot;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;              # لازم برای پاسخ جریانی (SSE)
    proxy_read_timeout 120s;
  }
}
